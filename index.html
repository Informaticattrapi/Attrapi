<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Portal Global B2 · Subdirección de Construcción · Seguimiento de Oficios</title>

<!-- Cargamos el SDK oficial de Supabase desde CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap');
  :root{
    --navy:#0B2436;
    --navy-2:#173C56;
    --navy-3:#0F2E42;
    --blue:#4C7DA8;
    --blue-light:#EAF1F6;
    --steel:#5B6B7C;
    --bg:#F1F3F5;
    --surface:#FFFFFF;
    --border:#DBE1E6;
    --text:#182530;
    --text-soft:#5B6B7C;
    --text-faint:#8B99A8;
    --radius:5px;
    --radius-sm:4px;
    --shadow:0 1px 2px rgba(11,36,54,.06), 0 8px 24px -12px rgba(11,36,54,.18);
    --font-body: 'Barlow', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-heading: 'Barlow Condensed', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font-body);
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,h4{margin:0;font-weight:700;color:var(--navy);font-family:var(--font-heading);letter-spacing:.01em;}
  p{margin:0;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  a{color:var(--blue);}
  ::selection{background:var(--blue-light);color:var(--navy);}
  :focus-visible{outline:2.5px solid var(--blue);outline-offset:2px;border-radius:4px;}
  
  .eyebrow{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--blue);}
  
  /* Loading screen */
  #boot-screen{
    position:fixed;inset:0;background:var(--navy);display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:14px;color:#cfe0f3;z-index:999;
  }
  #boot-screen .rail-spin{
    width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.25);
    border-top-color:#fff;animation:spin 0.9s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .hidden{display:none !important;}

  /* Layout principal */
  #app{display:none;min-height:100vh;}
  #app.active{display:flex;}

  .sidebar{
    width:236px;flex-shrink:0;background:linear-gradient(180deg,var(--navy) 0%, var(--navy-3) 100%);
    color:#fff;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:60;
  }
  .sidebar-head{padding:20px 18px 14px;display:flex;align-items:center;gap:10px;}
  .main-col{flex:1;margin-left:236px;display:flex;flex-direction:column;min-width:0;}
  .topbar{
    background:var(--surface);border-bottom:1px solid var(--border);padding:12px 24px;
    display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:40;
  }
  main{padding:22px 24px 60px;flex:1;}

  /* Formularios y tablas */
  .form-panel{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:18px;margin-bottom:16px;box-shadow:var(--shadow);
  }
  .form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  .field{display:flex;flex-direction:column;gap:4px;}
  .field label{font-size:12px;font-weight:700;color:var(--text-soft);}
  .field input, .field select, .field textarea{
    border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;font-size:13px;
  }
  .table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:760px;}
  thead th{text-align:left;font-size:10.5px;font-weight:800;padding:11px 14px;background:#FAFBFC;border-bottom:1px solid var(--border);}
  tbody td{padding:11px 14px;border-bottom:1px solid #F0F3F6;vertical-align:middle;}

  .btn-primary{background:var(--blue);color:#fff;border:none;border-radius:var(--radius-sm);padding:9px 14px;font-weight:700;}
  .btn-primary:hover{background:var(--navy-2);}
</style>
</head>
<body>

<div id="boot-screen">
  <div class="rail-spin"></div>
  <span>Conectando a la base de datos de Subdirección B2…</span>
</div>

<div id="app" class="active">
  <aside class="sidebar">
    <div class="sidebar-head">
      <h3>SUBDIRECCIÓN B2</h3>
    </div>
  </aside>

  <div class="main-col">
    <div class="topbar">
      <h2>Seguimiento de Oficios y Documentos</h2>
    </div>

    <main>
      <!-- Formulario de Registro -->
      <div class="form-panel">
        <h3>Registrar / Actualizar Documento</h3>
        <form id="doc-form">
          <input type="hidden" id="doc-id">
          <div class="form-grid">
            <div class="field">
              <label for="folio">Folio</label>
              <input type="text" id="folio" required placeholder="p.ej. B2-2026-001">
            </div>
            <div class="field">
              <label for="residencia">Residencia</label>
              <select id="residencia">
                <option value="Residencia 1 - Querétaro">Residencia 1 - Querétaro</option>
                <option value="Residencia 2 - San Juan del Río">Residencia 2 - San Juan del Río</option>
                <option value="Residencia 3 - Apaseo">Residencia 3 - Apaseo</option>
                <option value="Residencia 4 - Irapuato">Residencia 4 - Irapuato</option>
              </select>
            </div>
            <div class="field">
              <label for="estatus">Estatus</label>
              <select id="estatus">
                <option value="pendiente">Pendiente</option>
                <option value="en_proceso">En Proceso</option>
                <option value="completado">Completado</option>
              </select>
            </div>
            <div class="field" style="grid-column: 1 / -1;">
              <label for="asunto">Asunto</label>
              <input type="text" id="asunto" placeholder="Descripción corta del documento">
            </div>
            <div class="field">
              <label for="pdf-file">Adjuntar PDF</label>
              <input type="file" id="pdf-file" accept="application/pdf">
            </div>
          </div>
          <div style="margin-top: 14px;">
            <button type="submit" class="btn-primary" id="btn-save">Guardar en la nube</button>
          </div>
        </form>
      </div>

      <!-- Tabla de Datos -->
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Folio</th>
              <th>Residencia</th>
              <th>Asunto</th>
              <th>Estatus</th>
              <th>Documento</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-documentos">
            <!-- Datos renderizados en tiempo real -->
          </tbody>
        </table>
      </div>
    </main>
  </div>
</div>

<script>
(function(){
  "use strict";

  // 1. INICIALIZAR CREDENCIALES DE SUPABASE (USA ÚNICAMENTE LA CLAVE PÚBLICA/ANON)
  const SUPABASE_URL = 'https://tu-proyecto.supabase.co'; // Reemplaza con tu URL real
  const SUPABASE_ANON_KEY = 'sb_publishable_dryPR6hMQfFawUK-TBoO8A_50CwG1UF'; 
  
  const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const docForm = document.getElementById('doc-form');
  const tablaBody = document.getElementById('tabla-documentos');
  const bootScreen = document.getElementById('boot-screen');

  // 2. OBTENER Y RENDERIZAR DOCUMENTOS DESDE LA NUBE
  async function cargarDocumentos() {
    try {
      const { data, error } = await client
        .from('documentos')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        console.error('Error al cargar datos:', error);
      } else {
        renderTabla(data || []);
      }
    } catch (err) {
      console.error('Error inesperado:', err);
    } finally {
      // Garantizar que la pantalla de carga desaparezca siempre
      bootScreen.classList.add('hidden');
    }
  }

  function renderTabla(documentos) {
    tablaBody.innerHTML = '';

    if (documentos.length === 0) {
      tablaBody.innerHTML = `<tr><td colspan="6" style="text-align:center;">No hay documentos registrados.</td></tr>`;
      return;
    }

    documentos.forEach(doc => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td style="font-weight:bold;">${escapeHtml(doc.folio || '')}</td>
        <td>${escapeHtml(doc.residencia || '-')}</td>
        <td>${escapeHtml(doc.asunto || '-')}</td>
        <td><span class="eyebrow">${escapeHtml(doc.estatus || '')}</span></td>
        <td>
          ${doc.pdf_url 
            ? `<a href="${doc.pdf_url}" target="_blank" rel="noopener">📄 Ver PDF</a>` 
            : 'Sin archivo'}
        </td>
        <td>
          <button onclick="eliminarDoc('${doc.id}')" style="color:red;border:none;background:none;cursor:pointer;">Eliminar</button>
        </td>
      `;
      tablaBody.appendChild(tr);
    });
  }

  // Sanitizador simple para evitar XSS
  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, match => {
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
      return map[match];
    });
  }

  // 3. SUBIR PDF A SUPABASE STORAGE Y GUARDAR REGISTRO
  docForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btnSave = document.getElementById('btn-save');
    btnSave.disabled = true;

    const folio = document.getElementById('folio').value;
    const residencia = document.getElementById('residencia').value;
    const estatus = document.getElementById('estatus').value;
    const asunto = document.getElementById('asunto').value;
    const fileInput = document.getElementById('pdf-file');

    let pdf_url = null;

    try {
      if (fileInput.files.length > 0) {
        const file = fileInput.files[0];
        const cleanFileName = file.name.replace(/[^a-zA-Z0-9.-]/g, '_');
        const filePath = `oficios/${Date.now()}_${cleanFileName}`;

        const { error: uploadError } = await client.storage
          .from('documentos-b2')
          .upload(filePath, file, { upsert: true });

        if (uploadError) throw uploadError;

        const { data: publicUrlData } = client.storage
          .from('documentos-b2')
          .getPublicUrl(filePath);

        pdf_url = publicUrlData.publicUrl;
      }

      const { error: insertError } = await client
        .from('documentos')
        .insert([{ folio, residencia, estatus, asunto, pdf_url }]);

      if (insertError) throw insertError;

      docForm.reset();
      cargarDocumentos(); // Refrescar la tabla
    } catch (err) {
      alert('Ocurrió un error al guardar el registro.');
      console.error(err);
    } finally {
      btnSave.disabled = false;
    }
  });

  // 4. ELIMINAR DOCUMENTO
  window.eliminarDoc = async function(id) {
    if (!confirm('¿Deseas eliminar este registro?')) return;
    const { error } = await client.from('documentos').delete().eq('id', id);
    if (error) {
      console.error('Error al eliminar:', error);
      alert('No se pudo eliminar el documento.');
    } else {
      cargarDocumentos();
    }
  };

  // 5. CONFIGURAR SUSCRIPCIÓN EN TIEMPO REAL
  function escucharCambiosEnTiempoReal() {
    client
      .channel('realtime-documentos')
      .on(
        'postgres_changes',
        { event: '*', schema: 'public', table: 'documentos' },
        () => cargarDocumentos()
      )
      .subscribe();
  }

  // Inicialización
  cargarDocumentos();
  escucharCambiosEnTiempoReal();

})();
</script>
</body>
</html>
